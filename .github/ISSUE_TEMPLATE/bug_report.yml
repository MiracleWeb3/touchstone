name: Bug report
description: The gate blocked something it shouldn't, missed something it should have caught, or misbehaved
labels: [bug]
body:
  - type: dropdown
    id: kind
    attributes:
      label: What kind
      options:
        - False positive — it blocked a turn that was genuinely finished
        - False negative — it allowed a turn that clearly wasn't
        - It never fires at all
        - Build / install problem
        - Something else
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did you expect, what did you get instead?
    validations:
      required: true
  - type: textarea
    id: scan
    attributes:
      label: What the gate saw
      description: >
        Run `pantheon --scan <transcript.jsonl>` on the transcript for that session and paste the
        output — it prints the edits, the commands, the verdicts and the problems it would raise,
        which is almost always enough to see why. Redact anything you'd rather not share.
      render: json
    validations:
      required: false
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: "OS · compiler (c++ --version) · Claude Code version"
    validations:
      required: false
