<svg width="300" height="16" viewBox="0 0 300 16" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- section divider: a gold streak, as left on a touchstone -->
  <defs>
    <linearGradient id="streak" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b8863f" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#f0c766" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#b8863f" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="streakFaint" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b8863f" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#f0c766" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#b8863f" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="0" y="7" width="300" height="1.6" rx="0.8" fill="url(#streak)"/>
  <rect x="52" y="10.6" width="196" height="1" rx="0.5" fill="url(#streakFaint)"/>
</svg>
