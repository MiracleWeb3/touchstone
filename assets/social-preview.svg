<svg width="1280" height="640" viewBox="0 0 1280 640" xmlns="http://www.w3.org/2000/svg">
  <!-- repo social preview card (1280x640) — screenshot to PNG for GitHub settings -->
  <defs>
    <linearGradient id="wg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="0.55" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.32" cy="0.42" r="0.75">
      <stop offset="0" stop-color="#1c1440"/>
      <stop offset="1" stop-color="#0d1117"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f0c766"/>
      <stop offset="1" stop-color="#b8863f"/>
    </linearGradient>
    <linearGradient id="slabSheen" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.28"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b8863f" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#f0c766" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#b8863f" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-40%" width="140%" height="180%"><feGaussianBlur stdDeviation="10"/></filter>
  </defs>

  <rect width="1280" height="640" fill="url(#glow)"/>
  <rect x="80" y="48" width="1120" height="2.4" fill="url(#rule)"/>
  <rect x="80" y="590" width="1120" height="2.4" fill="url(#rule)"/>

  <!-- The touchstone: a basanite slab with gold streaks rubbed across it. The streak's colour
       tells you whether the metal is genuine — not what it is worth. -->
  <g transform="rotate(-4 320 300)">
    <rect x="170" y="225" width="300" height="150" rx="14" fill="#12161c"
          stroke="url(#wg)" stroke-width="3" stroke-opacity="0.8"/>
    <rect x="170" y="225" width="300" height="150" rx="14" fill="url(#slabSheen)"/>
    <g fill="none" stroke-linecap="round">
      <line x1="210" y1="339" x2="381" y2="263" stroke="url(#gold)" stroke-width="11.6" opacity="0.95"/>
      <line x1="238" y1="352" x2="428" y2="271" stroke="url(#gold)" stroke-width="6.8" opacity="0.68"/>
      <line x1="269" y1="358" x2="358" y2="320" stroke="url(#gold)" stroke-width="4.6" opacity="0.42"/>
    </g>
  </g>

  <text x="560" y="290" font-family="Georgia, 'Times New Roman', serif" font-size="76"
        letter-spacing="12" fill="url(#wg)" filter="url(#soft)" opacity="0.55">TOUCHSTONE</text>
  <text x="560" y="290" font-family="Georgia, 'Times New Roman', serif" font-size="76"
        letter-spacing="12" fill="url(#wg)">TOUCHSTONE</text>
  <text x="565" y="336" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="24"
        letter-spacing="7" fill="#8b949e">VERIFICATION FOR CODING AGENTS</text>

  <text x="565" y="400" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="22">
    <tspan fill="#3fb950">reads the turn</tspan><tspan fill="#484f58"> · </tspan><tspan fill="#a78bfa">sees what ran</tspan><tspan fill="#484f58"> · </tspan><tspan fill="#f85149">blocks fake "done"</tspan>
  </text>
  <text x="565" y="438" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="22">
    <tspan fill="#e3b341">11/11 caught</tspan><tspan fill="#484f58"> · </tspan><tspan fill="#79c0ff">0 FP</tspan><tspan fill="#484f58"> · </tspan><tspan fill="#e6edf3">one binary</tspan><tspan fill="#484f58"> · </tspan><tspan fill="#8b949e">no deps</tspan>
  </text>

  <rect x="550" y="482" width="660" height="64" rx="14" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="578" y="522" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="24">
    <tspan fill="#8b949e">$</tspan><tspan fill="#79c0ff"> claude plugin install touchstone@touchstone</tspan>
  </text>
</svg>
